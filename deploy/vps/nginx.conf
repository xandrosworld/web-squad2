server {
 listen 80;
 listen [::]:80;
 server_name squad2.xandrosworld.com;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://squad2.xandrosworld.com$request_uri; }
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name squad2.xandrosworld.com;
 ssl_certificate /etc/letsencrypt/live/squad2.xandrosworld.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/squad2.xandrosworld.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 client_max_body_size 60m;
 location / {
  proxy_pass http://127.0.0.1:3102;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_read_timeout 180s;
 }
}

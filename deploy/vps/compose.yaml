name: squad2
services:
  db:
    image: postgres:18-bookworm
    env_file: db.env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squad2 -d squad2"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build: .
    env_file: app.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const v=await r.json();process.exit(r.ok&&v.ready?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
